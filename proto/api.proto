syntax = "proto3";

package api;

option go_package = "github.com/yourusername/zerg/proto";

// Job represents a compute job
message Job {
  string id = 1;
  string name = 2;
  string description = 3;
  JobStatus status = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  string job_type = 7;  // Type of ML job (e.g., "training", "inference")
  bytes payload = 8;    // Job-specific data
}

// JobStatus represents the status of a job
enum JobStatus {
  UNKNOWN = 0;
  PENDING = 1;
  RUNNING = 2;
  COMPLETED = 3;
  FAILED = 4;
}

// Node represents a physical machine in the cluster
message Node {
  string id = 1;
  string name = 2;
  string ip_address = 3;
  bool is_on = 4;
  NodeRole role = 5;
  NodeStatus status = 6;
}

// NodeRole represents the role of a node in the cluster
enum NodeRole {
  UNDEFINED = 0;
  MASTER = 1;
  WORKER = 2;
}

// NodeStatus represents the status of a node
enum NodeStatus {
  NODE_UNKNOWN = 0;
  NODE_ONLINE = 1;
  NODE_OFFLINE = 2;
  NODE_ERROR = 3;
}

// StartJobRequest is the request for starting a job
message StartJobRequest {
  string name = 1;
  string description = 2;
  string job_type = 3;
  bytes payload = 4;
}

// StartJobResponse is the response for starting a job
message StartJobResponse {
  Job job = 1;
}

// GetJobStatusRequest is the request for getting job status
message GetJobStatusRequest {
  string job_id = 1;
}

// GetJobStatusResponse is the response for getting job status
message GetJobStatusResponse {
  Job job = 1;
}

// ListJobsRequest is the request for listing jobs
message ListJobsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string filter = 3;
}

// ListJobsResponse is the response for listing jobs
message ListJobsResponse {
  repeated Job jobs = 1;
  int32 total = 2;
}

// NodeControlRequest is the request for controlling a node
message NodeControlRequest {
  string node_id = 1;
}

// NodeControlResponse is the response for controlling a node
message NodeControlResponse {
  Node node = 1;
}

// ListNodesRequest is the request for listing nodes
message ListNodesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string filter = 3;
}

// ListNodesResponse is the response for listing nodes
message ListNodesResponse {
  repeated Node nodes = 1;
  int32 total = 2;
}

// BadgerService is the service running on the Raspberry Pi
service BadgerService {
  // Job management
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  
  // Node management
  rpc PowerOnNode(NodeControlRequest) returns (NodeControlResponse);
  rpc PowerOffNode(NodeControlRequest) returns (NodeControlResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
}

// OvermindService is the service running on the Ubuntu server
service OvermindService {
  // Job orchestration
  rpc ExecuteJob(Job) returns (Job);
  rpc CancelJob(GetJobStatusRequest) returns (GetJobStatusResponse);
  rpc GetJobDetails(GetJobStatusRequest) returns (GetJobStatusResponse);
  
  // Cluster management
  rpc GetClusterStatus(ListNodesRequest) returns (ListNodesResponse);
} 