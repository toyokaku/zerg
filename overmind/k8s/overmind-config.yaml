apiVersion: v1
kind: ConfigMap
metadata:
  name: overmind-config
  namespace: default
data:
  config.yaml: |
    log_level: info
    grpc_server:
      timeout: 120s
    nats:
      url: nats://nats:4222
      reconnect_wait: 5s
      max_reconnects: 10
      jetstream:
        enabled: true
        streams:
          - name: JOBS
            subjects: ["jobs.>"]
            storage: file
    containerd:
      socket: /run/containerd/containerd.sock
      namespace: k8s.io
      runtime: nvidia-container-runtime
    kubernetes:
      namespace: default
      job_ttl: 3600
      resource_limits:
        cpu: "1"
        memory: "2Gi"
        gpu: "1"
    gpu:
      enabled: true
      count: 2
      type: "p100"
      driver_path: "/usr/local/nvidia"
      device_plugin: true
      default_runtime: true 