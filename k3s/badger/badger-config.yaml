apiVersion: v1
kind: ConfigMap
metadata:
  name: badger-config
  namespace: default
data:
  config.yaml: |
    log_level: info
    http_server:
      timeout: 30s
    grpc_server:
      timeout: 60s
    nats:
      url: nats://nats:4222
      reconnect_wait: 5s
      max_reconnects: 10
    overmind:
      address: overmind:9090
      timeout: 30s
    k3s:
      in_cluster: true
      metrics_enabled: true 