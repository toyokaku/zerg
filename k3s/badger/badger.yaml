apiVersion: apps/v1
kind: Deployment
metadata:
  name: badger
  namespace: default
  labels:
    app: badger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: badger
  template:
    metadata:
      labels:
        app: badger
    spec:
      containers:
      - name: badger
        image: localhost/badger:latest
        imagePullPolicy: IfNotPresent
        command: ["/app/badger"]
        ports:
        - containerPort: 9090
          name: grpc
        args:
        - "--grpc-addr=:9090"
        - "--overmind-addr=overmind:9090"
        - "--nats-url=nats://nats:4222"
        env:
        - name: TZ
          value: "UTC"
        - name: LOG_LEVEL
          value: "info"
        - name: GOMAXPROCS
          value: "2"
        - name: GODEBUG
          value: "netdns=go"
        resources:
          limits:
            cpu: "300m"
            memory: "200Mi"
          requests:
            cpu: "100m"
            memory: "100Mi"
        livenessProbe:
          grpc:
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: badger-config
  namespace: default
data:
  config.yaml: |
    log_level: info
    grpc_server:
      timeout: 60s
    nats:
      url: nats://nats:4222
      reconnect_wait: 5s
      max_reconnects: 10
    overmind:
      address: overmind:9090
      timeout: 30s
    k3s:
      in_cluster: true
      metrics_enabled: true
---
apiVersion: v1
kind: Service
metadata:
  name: badger
  namespace: default
spec:
  selector:
    app: badger
  ports:
  - port: 9090
    targetPort: 9090
    name: grpc
  type: ClusterIP 