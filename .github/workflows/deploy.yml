name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@v1

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'

    - name: Build all targets
      run: |
        bazel build //...

    - name: Run tests
      run: |
        bazel test //...

    - name: Create secrets file
      if: github.ref == 'refs/heads/main'
      env:
        SECRETS_ENV: ${{ secrets.SECRETS_ENV }}
      run: |
        mkdir -p config
        echo "$SECRETS_ENV" > config/secrets.env

    - name: Deploy to Gateway
      if: github.ref == 'refs/heads/main'
      env:
        GATEWAY_SSH_KEY: ${{ secrets.GATEWAY_SSH_KEY }}
        GATEWAY_HOST: ${{ secrets.GATEWAY_HOST }}
        GATEWAY_USER: ${{ secrets.GATEWAY_USER }}
      run: |
        # Save SSH key
        echo "$GATEWAY_SSH_KEY" > /tmp/gateway_ssh_key
        chmod 600 /tmp/gateway_ssh_key
        
        # Deploy using Bazel
        bazel run //:all_deployments -- --cluster=minikube 